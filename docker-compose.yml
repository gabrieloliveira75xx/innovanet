services:
  homepage:
    build: ./homepage
    container_name: maximiza-homepage
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`maximiza.shop`) || Host(`www.maximiza.shop`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.routers.homepage.priority=1"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.services.homepage.loadbalancer.passHostHeader=true"
    restart: unless-stopped
    networks:
      - traefik-net

  painel:
    build: ./painel
    container_name: maximiza-painel
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.painel.rule=(Host(`maximiza.shop`) || Host(`www.maximiza.shop`)) && PathPrefix(`/painel`)"
      - "traefik.http.routers.painel.entrypoints=web"
      - "traefik.http.services.painel.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.painel-stripprefix.stripprefix.prefixes=/painel"
      - "traefik.http.middlewares.painel-stripprefix.stripprefix.forceSlash=true"
      - "traefik.http.routers.painel.middlewares=painel-stripprefix"
      - "traefik.http.services.painel.loadbalancer.passHostHeader=true"
    restart: unless-stopped
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
